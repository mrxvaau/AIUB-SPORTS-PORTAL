<!-- ======================================================
     PARTIAL: Registration Header
     Shared with dashboard header style.
     IDs: (none — static header for registration page)
     ====================================================== -->
<div class="header">
    <div class="header-left">
        <img src="images/logo.svg" alt="AIUB Logo" class="logo-img">
        <div class="logo-text">
            <h1>AIUB</h1>
            <p>SPORTS PORTAL</p>
        </div>
    </div>
    <div class="header-right">
        <button class="theme-toggle-btn"
            onclick="(function(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='light'?'dark':'light';h.setAttribute('data-theme',t);try{localStorage.setItem('dashboardTheme',t)}catch(e){}})()"
            title="Toggle dark/light theme">
            <svg class="theme-toggle-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <svg class="theme-toggle-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
        </button>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            ← Back to Dashboard
        </button>
    </div>
</div>
